name: Release VS Code extension

on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-viridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-viridian/package-lock.json
      - run: npm ci
      - name: Check tag matches extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "vscode-v$(node -p "require('./package.json').version")"
      - run: npm run build
      - run: xvfb-run -a npm test
      - run: npm run package
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vscode-viridian-*.vsix --title "VS Code extension ${GITHUB_REF_NAME#vscode-}" --generate-notes
